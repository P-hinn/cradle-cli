name: cradle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: P-hinn/cradle-cli@v0.1.2
        with:
          fail-on: high
          upload-artifact: true
          comment-on-pr: true
