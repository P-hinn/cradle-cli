name: release

# Only on a version tag. This is not continuous integration - nothing here runs
# on a push or a pull request.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Lets npm mint a provenance attestation from GitHub's OIDC token: proof
      # that this exact tarball was built from this exact commit, by this exact
      # workflow. It is the whole reason to publish from CI rather than a laptop.
      id-token: write
      # Creating the GitHub release and uploading its assets.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer, and setup-node still ships
      # 10.x with Node 22.
      - name: Use an npm that can do trusted publishing
        run: npm install --global npm@^11

      - run: npm ci

      - name: Refuse a tag that disagrees with package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}."
            echo "Publishing them out of step would put a version on npm that no tag points at."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_ENV"

      # prepublishOnly runs these again before publishing. Running them here too
      # means a broken build fails before anything is uploaded anywhere.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Scan cradle with cradle
        run: |
          set -euo pipefail
          node dist/cli/index.js scan . || true
          node dist/cli/index.js scan . --include-dev --output-dir .cradle-dev || true

      # No NODE_AUTH_TOKEN on purpose. Authentication is the OIDC exchange with
      # npm's trusted publisher for this repository and this workflow filename;
      # an empty token in the environment would only get in the way of it.
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The changelog section for this version, from its heading to the next.
          notes=$(awk -v tag="${TAG#v}" '
            $0 ~ "^## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="See CHANGELOG.md."
          fi

          # cradle's own SBOM, attached as evidence. A tool that asks people to
          # keep one should ship one.
          printf '%s\n' "$notes" > "${RUNNER_TEMP}/notes.md"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag \
            .cradle/sbom.cdx.json#"SBOM (production, CycloneDX 1.6)" \
            .cradle-dev/sbom.cdx.json#"SBOM (including dev dependencies)" \
            .cradle/report.html#"Report"
