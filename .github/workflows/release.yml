name: release

# Only on a version tag. This is not continuous integration - nothing here runs
# on a push or a pull request.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Lets npm mint a provenance attestation from GitHub's OIDC token: proof
      # that this exact tarball was built from this exact commit, by this exact
      # workflow. It is the whole reason to publish from CI rather than a laptop.
      id-token: write
      # Creating the GitHub release and uploading its assets.
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer, and setup-node still ships
      # 10.x with Node 22.
      - name: Use an npm that can do trusted publishing
        run: npm install --global npm@^11

      - run: npm ci

      - name: Refuse a tag that disagrees with package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}."
            echo "Publishing them out of step would put a version on npm that no tag points at."
            exit 1
          fi
          {
            echo "version=${version}"
            echo "package=$(node -p "require('./package.json').name")"
          } >> "$GITHUB_ENV"

      # prepublishOnly runs these again before publishing. Running them here too
      # means a broken build fails before anything is uploaded anywhere.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Scan cradle with cradle
        run: |
          set -uo pipefail
          # A non-zero exit here is a finding over the threshold, not a broken
          # run, and a release is not the place to gate on that. But a crash
          # would look identical, so the evidence files are checked instead of
          # trusted - before the publish, because a missing SBOM used to be
          # discovered only after the version was already on the registry.
          node dist/cli/index.js scan . || true
          node dist/cli/index.js scan . --include-dev --output-dir .cradle-dev || true

          for file in .cradle/sbom.cdx.json .cradle/report.html .cradle-dev/sbom.cdx.json; do
            if [ ! -s "$file" ]; then
              echo "::error::cradle did not write ${file}; the scan failed rather than merely finding something."
              exit 1
            fi
          done

      # No NODE_AUTH_TOKEN on purpose. Authentication is the OIDC exchange with
      # npm's trusted publisher for this repository and this workflow filename;
      # an empty token in the environment would only get in the way of it.
      #
      # Skipping an already-published version keeps the workflow re-runnable. A
      # release that fails after publishing but before the GitHub release should
      # be fixable by running it again, not by burning a version number.
      #
      # But skipping is only safe if the re-run is the same code. If the tag has
      # been moved since the publish, the steps below would attach an SBOM and a
      # report built from the new commit to a tarball built from the old one -
      # evidence that describes something other than what was shipped. For a tool
      # whose subject is supply-chain evidence that is the worst available
      # outcome, so it is an error rather than a warning. npm records the
      # publishing commit as gitHead; if it cannot be read, the match cannot be
      # proven and that is equally an error.
      - name: Publish to npm with provenance
        run: |
          set -euo pipefail
          if npm view "${package}@${version}" version >/dev/null 2>&1; then
            published=$(npm view "${package}@${version}" gitHead 2>/dev/null || true)
            if [ "$published" != "$GITHUB_SHA" ]; then
              echo "::error::${package}@${version} is already on the registry, published from commit ${published:-<unknown>}, but this run is ${GITHUB_SHA}."
              echo "Re-running would attach an SBOM and a report from this commit to a tarball built from that one."
              echo "A published version is final: bump the version and tag again rather than moving the tag."
              exit 1
            fi
            echo "::notice::${package}@${version} is already on the registry, from this same commit; skipping publish."
            exit 0
          fi
          npm publish --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The changelog section for this version, from its heading to the next.
          notes=$(awk -v tag="${TAG#v}" '
            $0 ~ "^## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="See CHANGELOG.md."
          fi

          printf '%s\n' "$notes" > "${RUNNER_TEMP}/notes.md"

          # cradle's own SBOM, attached as evidence: a tool that asks people to
          # keep one should ship one. Copied to distinct names first, because
          # release assets are keyed by filename and both SBOMs are called
          # sbom.cdx.json where they are written.
          assets="${RUNNER_TEMP}/assets"
          mkdir -p "$assets"
          cp .cradle/sbom.cdx.json "${assets}/${package}-${version}-sbom.cdx.json"
          cp .cradle-dev/sbom.cdx.json "${assets}/${package}-${version}-sbom-with-dev.cdx.json"
          cp .cradle/report.html "${assets}/${package}-${version}-report.html"

          # Create or update, so a run that failed after the release was made can
          # simply be run again.
          if gh release view "$TAG" >/dev/null 2>&1; then
            # --draft=false as well: a run that failed while the release was
            # still a draft should finish the job, not leave it invisible.
            gh release edit "$TAG" --title "$TAG" --notes-file "${RUNNER_TEMP}/notes.md" --draft=false
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --verify-tag
          fi

          gh release upload "$TAG" --clobber \
            "${assets}/${package}-${version}-sbom.cdx.json" \
            "${assets}/${package}-${version}-sbom-with-dev.cdx.json" \
            "${assets}/${package}-${version}-report.html"
